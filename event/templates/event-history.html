{% load static %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Event History</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body>
  <div class="center-form-wrapper">
    <div class="center-form-card" style="max-width:650px;">
      <h2>History — {{ event.name }}</h2>
      <table class="table">
        <thead><tr><th>Action</th><th>By</th><th>Notes</th><th>When</th></tr></thead>
        <tbody>
          {% for h in history %}
          <tr>
            <td class="text-capitalize">{{ h.action|cut:"_" }}</td>
            <td>{{ h.changed_by.username|default:"-" }}</td>
            <td>{{ h.notes }}</td>
            <td>{{ h.timestamp|date:"d-m-Y H:i" }}</td>
          </tr>
          {% empty %}
          <tr><td colspan="4" class="text-center text-muted">No history yet.</td></tr>
          {% endfor %}
        </tbody>
      </table>
      <a href="{% url 'event_list' %}" class="btn btn-success">Back to Event List</a>
    </div>
  </div>
</body>
</html>
