{% extends 'admin_base.html' %}
{% load static %}

{% block title %}Edit Category{% endblock %}

{% block content %}
  <div class="content-card" style="max-width:600px; margin:0 auto;">
    <h2>Edit Category</h2>

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-success">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-bold">Name*</label>
        <input type="text" name="name" class="form-control" value="{{ category.name }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Code*</label>
        <input type="text" name="code" class="form-control" value="{{ category.code }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Image</label>
        <input type="file" name="image" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Priority*</label>
        <input type="number" name="priority" class="form-control" value="{{ category.priority }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Status*</label>
        <select name="status" class="form-select" required>
          <option value="active" {% if category.status == "active" %}selected{% endif %}>Active</option>
          <option value="inactive" {% if category.status == "inactive" %}selected{% endif %}>Inactive</option>
          <option value="completed" {% if category.status == "completed" %}selected{% endif %}>Completed</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Update Category</button>
      <a href="{% url 'category_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
{% endblock %}
