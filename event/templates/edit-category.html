{% load static %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Edit Category</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body>
  <div class="center-form-wrapper">
    <div class="center-form-card">
      <h2>Edit Category</h2>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3"><label class="form-label fw-bold">Name*</label><input type="text" name="name" class="form-control" value="{{ category.name }}" required></div>
        <div class="mb-3"><label class="form-label fw-bold">Code*</label><input type="text" name="code" class="form-control" value="{{ category.code }}" required></div>
        <div class="mb-3"><label class="form-label fw-bold">Image</label><input type="file" name="image" class="form-control"></div>
        <div class="mb-3"><label class="form-label fw-bold">Priority*</label><input type="number" name="priority" class="form-control" value="{{ category.priority }}" required></div>
        <div class="mb-3">
          <label class="form-label fw-bold">Status*</label>
          <select name="status" class="form-select" required>
            <option value="active" {% if category.status == "active" %}selected{% endif %}>Active</option>
            <option value="inactive" {% if category.status == "inactive" %}selected{% endif %}>Inactive</option>
            <option value="completed" {% if category.status == "completed" %}selected{% endif %}>Completed</option>
          </select>
        </div>
        <button type="submit" class="btn btn-success">Update Category</button>
      </form>
    </div>
  </div>
</body>
</html>
