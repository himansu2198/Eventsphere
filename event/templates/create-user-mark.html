{% load static %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Mark Attendance</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body>
  <div class="center-form-wrapper">
    <div class="center-form-card" style="max-width:650px;">
      <h2>Mark Attendance — {{ event.name }}</h2>
      {% if messages %}{% for message in messages %}<div class="alert alert-success">{{ message }}</div>{% endfor %}{% endif %}
      <form method="post">
        {% csrf_token %}
        <table class="table">
          <thead><tr><th>Name</th><th>Present</th><th>Absent</th></tr></thead>
          <tbody>
            {% for m in members %}
            <tr>
              <td>{{ m.name }}</td>
              <td><input type="radio" name="status_{{ m.id }}" value="present" checked></td>
              <td><input type="radio" name="status_{{ m.id }}" value="absent"></td>
            </tr>
            {% empty %}
            <tr><td colspan="3" class="text-center text-muted">No members registered for this event.</td></tr>
            {% endfor %}
          </tbody>
        </table>
        <button type="submit" class="btn btn-success">Save Attendance</button>
      </form>
    </div>
  </div>
</body>
</html>
