{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="center-form-wrapper">
    <div class="center-form-card">
      <h2>Account Settings</h2>
      <p class="text-muted">Basic account settings placeholder — extend this with password change, notification preferences, etc.</p>
      <div class="mb-3">
        <label class="form-label fw-bold">Username</label>
        <input type="text" class="form-control" value="{{ user.username }}" disabled>
      </div>
      <a href="{% url 'dashboard' %}" class="btn btn-success">Back to Dashboard</a>
    </div>
  </div>
</body>
</html>
