{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=8">
</head>
<body>
  <div class="center-form-wrapper">
    <div class="center-form-card">
      <h2>Contact Us</h2>

      {% if messages %}
        {% for message in messages %}
          <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-bold">Name</label>
          <input type="text" name="name" class="form-control" value="{{ user.get_full_name|default:user.username }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Email</label>
          <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Subject</label>
          <input type="text" name="subject" class="form-control" placeholder="What is this regarding?">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Message</label>
          <textarea name="message" class="form-control" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
        <a href="{% url home_url %}" class="btn btn-secondary">Back to Dashboard</a>
      </form>
    </div>
  </div>
</body>
</html>
