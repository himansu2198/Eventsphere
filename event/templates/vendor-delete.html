{% extends 'admin_base.html' %}
{% load static %}

{% block title %}Delete Vendor{% endblock %}

{% block content %}      <div class="content-card">
        <h2 class="mb-4">Delete Vendor</h2>
        <p>Remove <strong>{{ vendor.name }}</strong> from your vendor list?</p>
        <form method="post">
          {% csrf_token %}
          <a href="{% url 'vendor_list' %}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-danger">Yes, Delete</button>
        </form>
      </div>

{% endblock %}
