{% extends 'admin_base.html' %}
{% load static %}

{% block title %}Allocate Resource{% endblock %}

{% block content %}
  <div class="content-card" style="max-width:600px; margin:0 auto;">
    <h2>Allocate Resource to Event</h2>

    {% if messages %}
      {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-bold">Resource*</label>
        <select name="resource" class="form-select" required>
          <option value="">----------</option>
          {% for r in resources %}
            <option value="{{ r.id }}">{{ r.name }} ({{ r.available_quantity }} available)</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Event*</label>
        <select name="event" class="form-select" required>
          <option value="">----------</option>
          {% for ev in events %}
            <option value="{{ ev.id }}">{{ ev.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Quantity*</label>
        <input type="number" name="quantity" class="form-control" value="1" min="1" required>
      </div>
      <button type="submit" class="btn btn-primary">Allocate</button>
      <a href="{% url 'resource_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
{% endblock %}
