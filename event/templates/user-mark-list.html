{% load static %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Attendance List</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body>
  <div class="center-form-wrapper">
    <div class="center-form-card" style="max-width:650px;">
      <h2>Attendance — {{ event.name }}</h2>
      <table class="table">
        <thead><tr><th>Name</th><th>Status</th><th>Marked At</th></tr></thead>
        <tbody>
          {% for mark in marks %}
          <tr>
            <td>{{ mark.member.name }}</td>
            <td class="text-capitalize">{{ mark.status }}</td>
            <td>{{ mark.marked_at|date:"d-m-Y H:i" }}</td>
          </tr>
          {% empty %}
          <tr><td colspan="3" class="text-center text-muted">No attendance marked yet.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
