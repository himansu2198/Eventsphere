{% load static %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Remove Wish</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body>
  <div class="center-form-wrapper">
    <div class="center-form-card">
      <h2>Remove Wish</h2>
      <p>Remove {{ wish.user.username }}'s wish for <strong>{{ wish.event.name }}</strong>?</p>
      <form method="post">
        {% csrf_token %}
        <a href="{% url 'event_wish_list' %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger">Yes, Remove</button>
      </form>
    </div>
  </div>
</body>
</html>
