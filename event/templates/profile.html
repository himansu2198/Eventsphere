{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=8">
</head>
<body>
  <div class="center-form-wrapper">
    <div class="center-form-card" style="max-width:480px;">
      <h2 class="text-center mb-4">My Profile</h2>

      {% if messages %}
        {% for message in messages %}
          <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <div class="text-center mb-4">
        {% if profile.avatar %}
          <img src="{{ profile.avatar.url }}" style="width:100px; height:100px; border-radius:50%; object-fit:cover; border:3px solid #4f46e5;">
        {% else %}
          <div style="width:100px; height:100px; border-radius:50%; background:#4f46e5; display:flex; align-items:center; justify-content:center; margin:0 auto; font-size:2.5rem; color:#fff;">
            <i class="bi bi-person-fill"></i>
          </div>
        {% endif %}
      </div>

      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3 text-center">
          <label class="form-label fw-bold">Profile Photo</label>
          <input type="file" name="avatar" class="form-control" accept="image/*">
        </div>

        <hr>

        <div class="mb-3">
          <label class="form-label fw-bold">Username</label>
          <input type="text" class="form-control" value="{{ user.username }}" disabled>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Email</label>
          <input type="email" name="email" class="form-control" value="{{ user.email|default:'' }}" placeholder="you@example.com">
        </div>

        <p><strong>Role:</strong> <span class="text-capitalize">{{ profile.role }}</span></p>
        <p><strong>Joined:</strong> {{ user.date_joined|date:"d-m-Y" }}</p>

        <button type="submit" class="btn btn-primary w-100 mt-2">Save Changes</button>
      </form>

      <a href="{% url back_url %}" class="btn btn-success w-100 mt-3">Back to Dashboard</a>
    </div>
  </div>
</body>
</html>
