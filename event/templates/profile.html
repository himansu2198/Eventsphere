{% extends 'participant_base.html' %}
{% load static %}

{% block title %}My Profile{% endblock %}

{% block content %}
  <div class="content-card" style="max-width:520px; margin:0 auto;">
    <h2 class="text-center mb-4">My Profile</h2>

    <div class="text-center mb-4">
      {% if profile.avatar %}
        <img src="{{ profile.avatar.url }}" style="width:100px; height:100px; border-radius:50%; object-fit:cover; border:3px solid #4f46e5;">
      {% else %}
        <div style="width:100px; height:100px; border-radius:50%; background:#4f46e5; display:flex; align-items:center; justify-content:center; margin:0 auto; font-size:2.5rem; color:#fff;">
          <i class="bi bi-person-fill"></i>
        </div>
      {% endif %}
    </div>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="mb-3 text-center">
        <label class="form-label">Profile Photo</label>
        <input type="file" name="avatar" class="form-control" accept="image/*">
      </div>

      <hr>

      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" value="{{ user.username }}" disabled>
      </div>

      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="full_name" class="form-control" value="{{ user.get_full_name }}" placeholder="Your full name">
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ user.email|default:'' }}" placeholder="you@example.com">
      </div>

      <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="tel" name="phone" class="form-control" value="{{ profile.phone|default:'' }}" placeholder="+91 XXXXX XXXXX">
      </div>

      <div class="card-info-box mb-3">
        <div class="row g-2">
          <div class="col-6">
            <div class="info-label">Role</div>
            <div class="info-value text-capitalize">{{ profile.role }}</div>
          </div>
          <div class="col-6">
            <div class="info-label">Member Since</div>
            <div class="info-value">{{ user.date_joined|date:"d-m-Y" }}</div>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100">Save Changes</button>
    </form>

    <a href="{% url 'change_password' %}" class="btn btn-secondary w-100 mt-2"><i class="bi bi-key-fill me-1"></i>Change Password</a>
  </div>
{% endblock %}
