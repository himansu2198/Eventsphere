{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delete Resource</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=8">
</head>
<body>
  <div class="center-form-wrapper">
    <div class="center-form-card">
      <h2>Delete Resource</h2>
      <p>Are you sure you want to remove <strong>{{ resource.name }}</strong> from inventory? This will also remove its allocation history.</p>
      <form method="post">
        {% csrf_token %}
        <a href="{% url 'resource_list' %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
      </form>
    </div>
  </div>
</body>
</html>
