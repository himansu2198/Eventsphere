{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Record Expense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=8">
</head>
<body>
  <div class="center-form-wrapper">
    <div class="center-form-card">
      <h2>Record Expense</h2>
      <p class="text-muted small">Expenses of ₹10,000 or more require approval before counting toward actual spend.</p>

      {% if messages %}
        {% for message in messages %}
          <div class="alert {% if message.tags == 'warning' %}alert-warning{% else %}alert-success{% endif %}">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-bold">Event*</label>
          <select name="event" class="form-select" required>
            <option value="">----------</option>
            {% for ev in events %}
              <option value="{{ ev.id }}">{{ ev.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Category*</label>
          <select name="category" class="form-select" required>
            <option value="venue">Venue Booking</option>
            <option value="catering">Catering</option>
            <option value="staffing">Staffing</option>
            <option value="marketing">Marketing</option>
            <option value="logistics">Logistics</option>
            <option value="equipment">Equipment Procurement</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Description</label>
          <input type="text" name="description" class="form-control" placeholder="e.g. Stage sound system rental">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Projected Amount (₹)*</label>
          <input type="number" step="0.01" name="projected_amount" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Actual Amount (₹)</label>
          <input type="number" step="0.01" name="actual_amount" class="form-control" value="0">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Invoice / Receipt</label>
          <input type="file" name="invoice" class="form-control" accept=".pdf,image/*">
          <div class="text-muted" style="font-size:0.78rem; margin-top:4px;">Optional — upload a PDF or image of the invoice.</div>
        </div>
        <button type="submit" class="btn btn-success">Record Expense</button>
        <a href="{% url 'budget_overview' %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</body>
</html>
