{% load static %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Cancel Registration</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body>
  <div class="center-form-wrapper">
    <div class="center-form-card">
      <h2>Cancel Registration</h2>
      <p>Cancel your registration for <strong>{{ member.event.name }}</strong>? Your QR ticket will be removed.</p>
      <form method="post">
        {% csrf_token %}
        <a href="{% url 'participant_dashboard' %}" class="btn btn-secondary">Keep Registration</a>
        <button type="submit" class="btn btn-danger">Yes, Cancel</button>
      </form>
    </div>
  </div>
</body>
</html>
