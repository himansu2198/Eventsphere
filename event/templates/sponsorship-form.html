{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Record Sponsorship</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="center-form-wrapper">
    <div class="center-form-card">
      <h2>Record Sponsorship Revenue</h2>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-bold">Event*</label>
          <select name="event" class="form-select" required>
            <option value="">----------</option>
            {% for ev in events %}
              <option value="{{ ev.id }}">{{ ev.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Sponsor Name*</label>
          <input type="text" name="sponsor_name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Amount (₹)*</label>
          <input type="number" step="0.01" name="amount" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Status*</label>
          <select name="status" class="form-select" required>
            <option value="pledged">Pledged</option>
            <option value="received">Received</option>
          </select>
        </div>
        <button type="submit" class="btn btn-success">Save Sponsorship</button>
        <a href="{% url 'budget_overview' %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</body>
</html>
