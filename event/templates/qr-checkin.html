{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Check-In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="center-form-wrapper">
    <div class="center-form-card">
      <h2>QR Check-In</h2>
      {% if result %}<div class="alert alert-info">{{ result }}</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-bold">Scan or Enter Code</label>
          <input type="text" name="code" class="form-control" placeholder="MEMBER-1" autofocus required>
        </div>
        <button type="submit" class="btn btn-success">Check In</button>
      </form>
    </div>
  </div>
</body>
</html>
