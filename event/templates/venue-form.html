{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% if venue %}Edit{% else %}Register{% endif %} Venue</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=8">
</head>
<body>
  <div class="center-form-wrapper">
    <div class="center-form-card">
      <h2>{% if venue %}Edit Venue{% else %}Register Venue{% endif %}</h2>

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-bold">Venue Name*</label>
          <input type="text" name="name" class="form-control" value="{{ venue.name|default:'' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Location</label>
          <input type="text" name="location" class="form-control" value="{{ venue.location|default:'' }}" placeholder="e.g. Main Campus, Block A">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Capacity*</label>
          <input type="number" name="capacity" class="form-control" value="{{ venue.capacity|default:0 }}" min="0" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Amenities</label>
          <textarea name="amenities" class="form-control" rows="2" placeholder="Comma-separated, e.g. Projector, AC, Sound System">{{ venue.amenities|default:'' }}</textarea>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Status*</label>
          <select name="status" class="form-select" required>
            <option value="available" {% if venue.status == "available" or not venue %}selected{% endif %}>Available</option>
            <option value="unavailable" {% if venue.status == "unavailable" %}selected{% endif %}>Unavailable</option>
            <option value="maintenance" {% if venue.status == "maintenance" %}selected{% endif %}>Under Maintenance</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">{% if venue %}Update{% else %}Save{% endif %} Venue</button>
        <a href="{% url 'venue_list' %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</body>
</html>
