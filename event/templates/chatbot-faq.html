{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAQ Assistant — EventSphere</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=8">
  <style>
    body {
      background: #f4f5f7;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .chat-widget {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(30, 27, 46, 0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 640px;
      transition: height 0.25s ease, opacity 0.2s ease;
    }

    .chat-widget.minimized {
      height: 72px;
    }
    .chat-widget.minimized .chat-body,
    .chat-widget.minimized .chat-footer {
      display: none;
    }

    /* Header */
    .chat-header {
      background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .chat-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
      position: relative;
    }

    .chat-avatar .online-dot {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 11px;
      height: 11px;
      background: #23a35a;
      border: 2px solid #4f46e5;
      border-radius: 50%;
    }

    .chat-header-info {
      flex-grow: 1;
      min-width: 0;
    }

    .chat-header-info h5 {
      margin: 0;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
    }

    .chat-header-info p {
      margin: 0;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.75);
    }

    .chat-header-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .chat-header-actions button {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.15);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s ease;
    }
    .chat-header-actions button:hover {
      background: rgba(255,255,255,0.28);
    }

    /* Body */
    .chat-body {
      flex-grow: 1;
      overflow-y: auto;
      padding: 16px;
      background: #f7f7fd;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 82%;
    }
    .msg-row.bot { align-self: flex-start; align-items: flex-start; }
    .msg-row.user { align-self: flex-end; align-items: flex-end; }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.87rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg-row.bot .msg-bubble {
      background: #fff;
      color: #1e1b2e;
      border: 1px solid #ece9fb;
      border-top-left-radius: 4px;
    }
    .msg-row.user .msg-bubble {
      background: #4f46e5;
      color: #fff;
      border-top-right-radius: 4px;
    }

    .msg-time {
      font-size: 0.68rem;
      color: #9691b5;
      margin-top: 4px;
      padding: 0 4px;
    }

    .typing-row {
      align-self: flex-start;
    }
    .typing-bubble {
      background: #fff;
      border: 1px solid #ece9fb;
      border-radius: 14px;
      border-top-left-radius: 4px;
      padding: 12px 16px;
      display: inline-flex;
      gap: 4px;
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #b3aed6;
      animation: typingBounce 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    /* Quick actions */
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 16px;
      background: #fff;
      border-top: 1px solid #ece9fb;
      flex-shrink: 0;
    }
    .quick-action-btn {
      border: 1px solid #dcdfe6;
      background: #fff;
      color: #4f46e5;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .quick-action-btn:hover {
      background: #4f46e5;
      color: #fff;
      border-color: #4f46e5;
    }

    /* Footer input */
    .chat-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      background: #fff;
      border-top: 1px solid #ece9fb;
      flex-shrink: 0;
    }
    .chat-footer input {
      flex-grow: 1;
      border: 1px solid #dcdfe6;
      border-radius: 20px;
      padding: 9px 16px;
      font-size: 0.87rem;
      outline: none;
    }
    .chat-footer input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 0.15rem rgba(79, 70, 229, 0.15);
    }
    .chat-footer button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #4f46e5;
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .chat-footer button:hover { background: #3730a3; }
    .chat-footer button:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 480px) {
      body { padding: 0; }
      .chat-widget {
        max-width: 100%;
        height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>

  <div class="chat-widget" id="chatWidget">

    <div class="chat-header">
      <div class="chat-avatar">
        <i class="bi bi-robot"></i>
        <span class="online-dot"></span>
      </div>
      <div class="chat-header-info">
        <h5>Chatty</h5>
        <p>Support Bot · EventSphere</p>
      </div>
      <div class="chat-header-actions">
        <button type="button" id="minimizeBtn" title="Minimize"><i class="bi bi-dash-lg"></i></button>
        <button type="button" id="closeBtn" title="Close"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <div class="chat-body" id="chatBody">
      <div class="msg-row bot">
        <div class="msg-bubble">Hi! I'm Chatty 👋 I can help with registering for events, QR tickets, and using EventSphere. What would you like to know?</div>
        <div class="msg-time" id="initialTime"></div>
      </div>
    </div>

    <div class="quick-actions">
      <button type="button" class="quick-action-btn" data-q="What features does EventSphere have?">✨ Features</button>
      <button type="button" class="quick-action-btn" data-q="How can I get support?">🛠️ Support</button>
      <button type="button" class="quick-action-btn" data-q="What are the frequently asked questions?">❓ FAQ</button>
      <button type="button" class="quick-action-btn" data-q="How can I view and register for events?">📅 Events</button>
    </div>

    <form class="chat-footer" id="chatForm">
      {% csrf_token %}
      <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off" required>
      <button type="submit" id="sendBtn"><i class="bi bi-send-fill"></i></button>
    </form>

  </div>

  <script>
    const chatWidget = document.getElementById('chatWidget');
    const chatBody = document.getElementById('chatBody');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const minimizeBtn = document.getElementById('minimizeBtn');
    const closeBtn = document.getElementById('closeBtn');

    function formatTime() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      return hours.toString().padStart(2, '0') + ':' + minutes;
    }

    document.getElementById('initialTime').textContent = formatTime();

    function scrollToBottom() {
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function appendMessage(text, isUser) {
      const row = document.createElement('div');
      row.className = 'msg-row ' + (isUser ? 'user' : 'bot');

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = text;

      const time = document.createElement('div');
      time.className = 'msg-time';
      time.textContent = formatTime();

      row.appendChild(bubble);
      row.appendChild(time);
      chatBody.appendChild(row);
      scrollToBottom();
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'msg-row bot typing-row';
      row.id = 'typingRow';
      row.innerHTML = '<div class="typing-bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>';
      chatBody.appendChild(row);
      scrollToBottom();
    }

    function hideTyping() {
      document.getElementById('typingRow')?.remove();
    }

    function sendQuestion(question) {
      appendMessage(question, true);
      chatInput.value = '';
      sendBtn.disabled = true;
      showTyping();

      fetch("{% url 'chatbot_faq' %}", {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'X-Requested-With': 'XMLHttpRequest',
        },
        body: 'question=' + encodeURIComponent(question) + '&csrfmiddlewaretoken={{ csrf_token }}',
      })
      .then(res => res.json())
      .then(data => {
        hideTyping();
        appendMessage(data.answer, false);
        sendBtn.disabled = false;
      })
      .catch(() => {
        hideTyping();
        appendMessage("Something went wrong. Please try again.", false);
        sendBtn.disabled = false;
      });
    }

    chatForm.addEventListener('submit', function (e) {
      e.preventDefault();
      const question = chatInput.value.trim();
      if (question) sendQuestion(question);
    });

    document.querySelectorAll('.quick-action-btn').forEach(btn => {
      btn.addEventListener('click', () => sendQuestion(btn.dataset.q));
    });

    minimizeBtn.addEventListener('click', () => {
      chatWidget.classList.toggle('minimized');
      minimizeBtn.innerHTML = chatWidget.classList.contains('minimized')
        ? '<i class="bi bi-chevron-up"></i>'
        : '<i class="bi bi-dash-lg"></i>';
    });

    closeBtn.addEventListener('click', () => {
      window.history.back();
    });
  </script>

</body>
</html>
