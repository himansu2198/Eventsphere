{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Update Registration Status</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=8">
</head>
<body>
  <div class="center-form-wrapper">
    <div class="center-form-card">
      <h2>Update Registration Status</h2>
      <p class="text-muted">{{ member.name }} — {{ member.event.name }}</p>

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Registration Status*</label>
          <select name="registration_status" class="form-select" required>
            <option value="confirmed" {% if member.registration_status == "confirmed" %}selected{% endif %}>Confirmed</option>
            <option value="pending" {% if member.registration_status == "pending" %}selected{% endif %}>Pending</option>
            <option value="waitlisted" {% if member.registration_status == "waitlisted" %}selected{% endif %}>Waitlisted</option>
            <option value="cancelled" {% if member.registration_status == "cancelled" %}selected{% endif %}>Cancelled</option>
          </select>
        </div>
        <a href="{% url 'event_detail' member.event.pk %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Update</button>
      </form>
    </div>
  </div>
</body>
</html>
