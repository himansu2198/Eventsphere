{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Update Event Status</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="center-form-wrapper">
    <div class="center-form-card">
      <h2>Update Status — {{ event.name }}</h2>

      {% if messages %}
        {% for message in messages %}
          <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <p class="text-muted">Current status: <strong>{{ event.status }}</strong></p>

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-bold">Status*</label>
          <select name="status" class="form-select" required>
            <option value="active" {% if event.status == "active" %}selected{% endif %}>Active</option>
            <option value="upcoming" {% if event.status == "upcoming" %}selected{% endif %}>Upcoming</option>
            <option value="completed" {% if event.status == "completed" %}selected{% endif %}>Completed</option>
          </select>
        </div>
        <a href="{% url 'event_list' %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-success">Update</button>
      </form>
    </div>
  </div>
</body>
</html>
