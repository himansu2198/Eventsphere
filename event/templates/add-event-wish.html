{% extends 'admin_base.html' %}
{% load static %}

{% block title %}Add Event User Wish{% endblock %}


{% block content %}
  <div class="content-card">
    <div class="page-header-row">
      <div>
        <h2>Add Event User Wish</h2>
      </div>
      <a href="{% url 'event_wish_list' %}" class="btn-dark-pill"><i class="bi bi-list-ul"></i>Event Wish List</a>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-bold">Event*</label>
        <select name="event" class="form-select" required>
          <option value="">----------</option>
          {% for ev in events %}
            <option value="{{ ev.id }}">{{ ev.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">User*</label>
        <select name="user" class="form-select" required>
          <option value="">----------</option>
          {% for u in users %}
            <option value="{{ u.id }}">{{ u.username }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Status*</label>
        <select name="status" class="form-select" required>
          <option value="">----------</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Add</button>
    </form>
  </div>
{% endblock %}
