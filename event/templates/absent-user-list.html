{% load static %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Absent Users</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body>
  <div class="center-form-wrapper">
    <div class="center-form-card" style="max-width:650px;">
      <h2>Absent — {{ event.name }}</h2>
      <table class="table">
        <thead><tr><th>Name</th><th>Email</th></tr></thead>
        <tbody>
          {% for mark in marks %}
          <tr><td>{{ mark.member.name }}</td><td>{{ mark.member.email }}</td></tr>
          {% empty %}
          <tr><td colspan="2" class="text-center text-muted">No absences recorded.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
